<svg width="340" height="90" viewBox="0 0 340 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="North Alpha">
  <title>North Alpha</title>
  <!-- Compass-needle mark: bright north half, muted south half -->
  <circle cx="45" cy="45" r="30" fill="none" stroke="#3A466E" stroke-width="2"/>
  <polygon points="45,18 51,45 39,45" fill="#38BDF8"/>
  <polygon points="45,72 51,45 39,45" fill="#3A466E"/>
  <circle cx="45" cy="45" r="3.5" fill="#0B1020" stroke="#38BDF8" stroke-width="1.5"/>
  <!-- Wordmark. Final build should load 'Space Grotesk' (or Satoshi) for exact match. -->
  <text x="92" y="58" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="34" font-weight="600">
    <tspan fill="#F5F7FF">North</tspan><tspan fill="#38BDF8"> Alpha</tspan>
  </text>
</svg>
